name: Build WebGPU demos and deploy Pages
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      BINARYEN_CORES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test site staging and SDK pin handling
        run: python3 -m unittest discover -s tests -p test_pages.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Test capability selection without an SDK
        run: node tests/check-runtime-selection.mjs
      - name: Verify capability selection in Chromium without an SDK
        run: |
          npm ci --prefix tests/browser --ignore-scripts
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          node tests/browser/check-selection.mjs --chrome "$CHROME" --output test-results-selection.json
      - name: Read the reviewed SDK release pin
        run: tools/read-sdk-pin.sh >> "$GITHUB_ENV"
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.12'
      - name: Install runner and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patch
      - name: Download both fixed public SDK packages
        run: |
          for arch in wasm32 wasm64; do
            WASM_ARCH="$arch" tools/download-nikki.sh ".deps/nikki-$arch"
          done
      - name: Link and check both application architectures
        run: |
          for arch in wasm32 wasm64; do
            WASM_ARCH="$arch" NIKKI_PREFIX=".deps/nikki-$arch" BUILD_DIR="build-$arch" tools/build-webgpu.sh
            node tests/check-module-abi.mjs --expect-arch "$arch" "build-$arch"/assets/*-webgpu.mjs > "test-results-module-abi-$arch.json"
            cat "test-results-module-abi-$arch.json"
            node tests/check-vkpeak-contract.mjs "build-$arch/assets/vkpeak-webgpu.mjs" > "test-results-vkpeak-contract-$arch.json"
            cat "test-results-vkpeak-contract-$arch.json"
            cmake --build "build-$arch" --target vkpeak-capabilities --parallel 2
            node tests/check-vkpeak-capabilities.mjs "build-$arch/tests/vkpeak-capabilities.mjs" > "test-results-vkpeak-capabilities-$arch.json"
            cat "test-results-vkpeak-capabilities-$arch.json"
          done
      - name: Build diagnostic CPU wrapper and compare against committed CPU modules
        run: |
          emcmake cmake -S . -B build-cpu-reference -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSQUEEZENET_CPU_ORACLE=ON -DNCNN_WEBGPU_EXTRA_DEMOS=ON \
            -DNCNN_SOURCE_DIR="$PWD/.deps/ncnn"
          for target in squeezenet-reference benchncnn-reference benchncnn-llm-reference; do
            cmake --build build-cpu-reference --target "$target" --parallel 2
          done
          node tests/run-cpu-oracle.mjs build-cpu-reference/assets/squeezenet-reference.mjs
          node tests/check-benchmark-contract.mjs build-cpu-reference/assets > test-results-benchmark-contract.json
          cat test-results-benchmark-contract.json
          c++ -std=c++11 tests/benchmark-device-validation.cpp -o build-cpu-reference/benchmark-device-validation
          build-cpu-reference/benchmark-device-validation
      - name: Verify worker ABI and CPU versus WebGPU results
        timeout-minutes: 80
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          node tests/browser/run.mjs --chrome "$CHROME" --module-dir build-wasm32/assets --module64-dir build-wasm64/assets \
            --expect-arch wasm64 --extra-demos --output test-results-browser-wasm64.json
          node tests/browser/run.mjs --chrome "$CHROME" --module-dir build-wasm32/assets --module64-dir build-wasm64/assets \
            --expect-arch wasm32 --disable-memory64 --extra-demos --output test-results-browser-wasm32.json
      - name: Stage the complete site
        run: |
          python3 tools/stage-site.py --module-dir build-wasm32/assets --wasm64-module-dir build-wasm64/assets --output _site
          git diff --exit-code -- assets models *.html *.js *.css *-worker.mjs
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Record build provenance and test reports
        run: |
          mkdir -p build-reports
          for arch in wasm32 wasm64; do
            mkdir -p "build-reports/$arch"
            cp ".deps/nikki-$arch/"{source-revision,release-version,emsdk-version,architecture}.txt "build-reports/$arch/"
          done
          git -C .deps/ncnn rev-parse HEAD > build-reports/ncnn-source-revision.txt
          git -C .deps/vkpeak rev-parse HEAD > build-reports/vkpeak-source-revision.txt
          cp test-results-*.json build-reports/
      - uses: actions/upload-artifact@v4
        with:
          name: webgpu-build-reports
          path: build-reports/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webgpu-failure-results
          path: test-results-*.json
          if-no-files-found: ignore

  deploy:
    if: >-
      github.repository == 'nihui/ncnn-webgpu-test' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the tested site
        id: deployment
        uses: actions/deploy-pages@v4
