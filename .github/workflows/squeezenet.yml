name: WebGPU demos prebuilt nikki consumer
on:
  workflow_dispatch:
    inputs:
      nikki_version:
        description: 'Published nikki YYYYMMDD SDK release tag'
        required: true
        type: string
      nikki_revision:
        description: 'Exact 40-character nikki source commit from that release'
        required: true
        type: string
permissions:
  contents: read
jobs:
  squeezenet:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BINARYEN_CORES: '1'
      NIKKI_VERSION: ${{ inputs.nikki_version }}
      NIKKI_REVISION: ${{ inputs.nikki_revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install runner and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patch
          npm ci --prefix tests/browser --ignore-scripts
      - name: Download the fixed public SDK release
        run: tools/download-nikki.sh .deps/nikki
      - name: Link the applications against the prebuilt SDK
        env:
          NIKKI_PREFIX: .deps/nikki
        run: tools/build-webgpu.sh
      - name: Check linked module ABI without GPU execution
        run: |
          node tests/check-module-abi.mjs build/assets/*-webgpu.mjs > test-results-module-abi.json
          cat test-results-module-abi.json
          node tests/check-vkpeak-contract.mjs build/assets/vkpeak-webgpu.mjs > test-results-vkpeak-contract.json
          cat test-results-vkpeak-contract.json
          cmake --build build --target vkpeak-capabilities --parallel 2
          node tests/check-vkpeak-capabilities.mjs build/tests/vkpeak-capabilities.mjs > test-results-vkpeak-capabilities.json
          cat test-results-vkpeak-capabilities.json
      - name: Build diagnostic CPU wrapper and compare against committed CPU modules
        run: |
          emcmake cmake -S . -B build-cpu-reference -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSQUEEZENET_CPU_ORACLE=ON -DNCNN_WEBGPU_EXTRA_DEMOS=ON \
            -DNCNN_SOURCE_DIR="$PWD/.deps/ncnn"
          for target in squeezenet-reference benchncnn-reference benchncnn-llm-reference; do
            cmake --build build-cpu-reference --target "$target" --parallel 2
          done
          node tests/run-cpu-oracle.mjs build-cpu-reference/assets/squeezenet-reference.mjs
          node tests/check-benchmark-contract.mjs build-cpu-reference/assets > test-results-benchmark-contract.json
          cat test-results-benchmark-contract.json
          c++ -std=c++11 tests/benchmark-device-validation.cpp -o build-cpu-reference/benchmark-device-validation
          build-cpu-reference/benchmark-device-validation
      - name: Verify worker ABI and CPU versus WebGPU results
        timeout-minutes: 40
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          node tests/browser/run.mjs --chrome "$CHROME" --module-dir build/assets --extra-demos --output test-results-browser.json
      - name: Package the pairs and record the selected producer
        run: |
          mkdir -p artifact/assets
          cp build/assets/*-webgpu.mjs build/assets/*-webgpu.wasm artifact/assets/
          printf '%s\n' "$NIKKI_REVISION" > artifact/nikki-source-revision.txt
          printf '%s\n' "$NIKKI_VERSION" > artifact/nikki-release-version.txt
          cp .deps/nikki/emsdk-version.txt artifact/emsdk-version.txt
          git -C .deps/ncnn rev-parse HEAD > artifact/ncnn-source-revision.txt
          git -C .deps/vkpeak rev-parse HEAD > artifact/vkpeak-source-revision.txt
          cp test-results-*.json artifact/
          git diff --exit-code -- assets models backend-worker.mjs benchncnn-worker.mjs benchncnn-llm-worker.mjs vkpeak-worker.mjs app.js index.html
      - uses: actions/upload-artifact@v4
        with:
          name: ncnn-webgpu-${{ inputs.nikki_revision }}
          path: artifact/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webgpu-failure-results
          path: test-results-*.json
          if-no-files-found: ignore
